<body style="font-family:system-ui;max-width:40rem;margin:3rem auto;padding:0 1rem;line-height:1.7">
<h1>隐私权政策</h1>
<p>本工具为作者个人自用,不面向其他用户开放,不收集、存储或共享任何第三方的个人信息。</p>
<h2>数据访问范围</h2>
<p>本工具通过 Google Drive API 访问作者本人 Google 账号中的一个指定文件夹,
用途仅限于列出该文件夹内的文件名并上传作者本机生成的文档。</p>
<h2>数据存储与共享</h2>
<p>访问凭据仅保存在作者本人的电脑上。本工具不将任何数据传输给第三方,
不做分析,不用于广告用途。</p>
<h2>联系方式</h2>
<p>如有疑问请通过 GitHub 仓库的 Issues 联系。</p>
</body>
